<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" />

  <!-- Outer Radar Reticle -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="128" fill="none" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="4" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="64" x2="256" y2="144" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="368" x2="256" y2="448" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <line x1="64" y1="256" x2="144" y2="256" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <line x1="368" y1="256" x2="448" y2="256" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

  <!-- Center Target Core -->
  <circle cx="256" cy="256" r="54" fill="url(#amberGrad)" filter="url(#glow)" />
  
  <!-- Lightning Bolt / Flash Cutout in Core -->
  <path d="M266 220 L242 254 L260 254 L246 292 L274 250 L256 250 Z" fill="#090d16" stroke="#090d16" stroke-width="2" stroke-linejoin="round" />
</svg>
